[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadsmith"
# Read from version.py, so the number lives in exactly one place and the
# update check cannot disagree with what was released.
dynamic = ["version"]
description = "Find businesses with no website, build them one, sell it in person."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "typer>=0.12",
    "requests>=2.31",
    "jinja2>=3.1",
    "rich>=13.7",
    "phonenumbers>=8.13",
    "python-dotenv>=1.0",
    # Terminal and print QR codes for the preview. Pure Python, no transitive
    # dependencies, and imported lazily so every other command runs without it.
    "segno>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# The desktop app. Optional so a CLI-only checkout stays small — the GUI tests
# skip themselves when it is absent.
gui = ["PySide6-Essentials>=6.6"]
# Everything the Windows job needs on top of `dev`. No Pillow: PyInstaller only
# needs it to convert an icon into .ico, and build/leadsmith.ico is already one.
build = ["PySide6-Essentials>=6.6", "pyinstaller>=6.3"]

[project.scripts]
leadsmith = "cli:app"

[project.gui-scripts]
leadsmith-app = "leadsmith_app:main"

[tool.setuptools]
include-package-data = true
py-modules = ["billing", "board", "cli", "config", "db", "demo", "deploy",
              "design", "enrich", "generate", "hours", "invoice",
              "leadsmith_app", "offboard", "pitch", "prospect", "qr", "search",
              "startup", "stock", "update", "version", "visuals"]
packages = ["gui", "gui.pages"]

# The twelve sample businesses `leadsmith demo` builds from. Data, not code,
# and shipped so the portfolio works out of an installed copy.
[tool.setuptools.package-data]
"*" = ["templates/**/*", "demo/fixtures/*.json"]

[tool.setuptools.dynamic]
version = {attr = "version.VERSION"}

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadsmith"
version = "0.1.0"
description = "Find businesses with no website, build them one, sell it in person."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "typer>=0.12",
    "requests>=2.31",
    "jinja2>=3.1",
    "rich>=13.7",
    "phonenumbers>=8.13",
    "python-dotenv>=1.0",
    # Terminal and print QR codes for the preview. Pure Python, no transitive
    # dependencies, and imported lazily so every other command runs without it.
    "segno>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
leadsmith = "cli:app"

[tool.setuptools]
include-package-data = true
py-modules = ["billing", "board", "cli", "config", "db", "deploy", "design",
              "enrich", "generate", "hours", "offboard", "pitch", "prospect",
              "qr", "search", "visuals"]

[tool.pytest.ini_options]
testpaths = ["tests"]

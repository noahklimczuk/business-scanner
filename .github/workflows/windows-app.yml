name: Windows app

# Built here rather than on a developer machine because that is the only way
# this repository can produce a Windows binary at all — PyInstaller does not
# cross-compile, so a Linux or Mac checkout can write the app but never ship it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release under this tag, e.g. v0.1.0. Blank builds without releasing."
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Qt's system libraries
        # PySide6 installs from a wheel, but the Qt shared objects inside it
        # link against these and the runner does not ship them. Without this,
        # `import PySide6.QtWidgets` dies with "libEGL.so.1: cannot open shared
        # object file" — even under the offscreen platform, which needs no
        # display but still loads the same libraries.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libxkbcommon0 \
                                      libdbus-1-3 libfontconfig1
      - run: pip install -e ".[dev]" PySide6-Essentials
      - name: Tests
        run: python -m pytest tests/ -q
        env:
          QT_QPA_PLATFORM: offscreen
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Contact form tests
        # The Pages Function arrives with Phase 5, which is not merged. Until
        # then there is nothing here to test, and a workflow that fails because
        # an unmerged branch is unmerged teaches everyone to ignore red CI.
        run: |
          if [ -f functions/api/enquiry.test.mjs ]; then
            node --test functions/api/enquiry.test.mjs
          else
            echo "functions/ not present on this branch — nothing to test."
          fi

  build:
    needs: test
    runs-on: windows-latest
    # Needed by the release step below. The default token is read-only on this
    # repository, and without this a `v*` tag builds the exe, uploads it as a
    # 90-day artifact, and then fails at the last step with a 403 — the one run
    # where the permanent download link was the entire point.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Install
        # The dev extra, not a bare install: the smoke test below runs under
        # pytest, and without it this job fails before it ever reaches the
        # build — an exe that was never attempted, reported as a broken build.
        run: |
          pip install -e ".[dev]"
          pip install PySide6-Essentials pyinstaller

      - name: Smoke test the app offscreen
        run: python -m pytest tests/test_gui.py -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Build Leadsmith.exe
        run: pyinstaller build/leadsmith.spec --noconfirm

      - name: Check it starts
        # A build that produces an exe which crashes on launch is worse than a
        # failed build, because it looks like success. --selftest exits 0 after
        # constructing the window without showing it.
        run: |
          dist\Leadsmith.exe --selftest
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Report size
        run: |
          $size = (Get-Item dist\Leadsmith.exe).Length / 1MB
          Write-Host ("Leadsmith.exe is {0:N1} MB" -f $size)

      - uses: actions/upload-artifact@v4
        with:
          name: Leadsmith-windows
          path: dist/Leadsmith.exe
          if-no-files-found: error

      - name: Attach to release
        # Two ways in. A `v*` tag releases what that tag points at, which is the
        # normal path. `release_tag` on a manual run does the same for a commit
        # that has no tag yet — the action creates it — which is what makes a
        # release possible from the Actions tab, without a local tag push.
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          # Empty on a tag push, where the action falls back to the tag in
          # github.ref. Set only on a manual release.
          tag_name: ${{ inputs.release_tag }}
          files: dist/Leadsmith.exe
